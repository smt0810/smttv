<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>בנייני סמארט</title>

    <style type="text/css">
        body {
            margin: 0px;
            padding: 0px;
        }

        .clock {
            /* Removed fixed positioning for flex alignment */
            border: 3px solid #fff;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px;
            margin-left: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        a.weatherwidget-io {
            width: 100%;
            padding: 0px;
            margin: 0px;
            background: rgb(29, 78, 143);
        }

        .fullscreen-iframe {
            position: fixed;
            height: 75vh;
            bottom: 15vh;
            width: 100%;
            border: none;
            left: 0;
            padding: 0px;
            margin: 0px;
            /*transform: scaleX(1);*/
        }

        .mivzakim {
            position: fixed;
            bottom: 0;
            right: 0vw;
            width: 100%;
            height: 15vh;
            background-color: #1d588f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* left and right alignment */
        }

        .mivzakim iframe {
            height: 100%;
            width: 98%;
            border-style: none;
        }

        #music-enable {
            display: none;
            position: fixed;
            left: 16px;
            bottom: calc(15vh + 16px);
            z-index: 9999;
            background: rgba(29, 88, 143, 0.92);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 18px;
            padding: 12px 20px;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
    <script>// Refresh the page every 60 min
        setTimeout(function () {
            location.reload();
        }, 1000 * 60 * 60);</script>
    <script async src="https://app3.weatherwidget.org/js/?id=ww_49b4a7394acc4"></script>

</head>

<body>
    <iframe class="fullscreen-iframe"
        src="https://docs.google.com/presentation/d/1rpI9NxbYFE67DhF0YNK3mdrG-x5kArrjJEveuyFLM2U/embed?start=true&loop=true&delayms=10000&rm=minimal"
        frameborder="0" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true">
    </iframe>
    <a class="weatherwidget-io" href="https://forecast7.com/he/32d0734d82/ramat-gan/" data-label_1="מזג אוויר"
        data-label_2="רמת גן" data-theme="original">מזג אוויר רמת גן</a>
    <script>!function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (!d.getElementById(id)) { js = d.createElement(s); js.id = id; js.src = 'https://weatherwidget.io/js/widget.min.js'; fjs.parentNode.insertBefore(js, fjs); } }(document, 'script', 'weatherwidget-io-js');</script>

    <div class="mivzakim">
        <div class="clock">
            <iframe scrolling="no" frameborder="no" clocktype="html5"
                style="overflow:hidden;border:0;margin:0;padding:0;width:280px;height:60px;display:block;"
                src="https://www.clocklink.com/html5embed.php?clock=047&timezone=Israel_Jerusalem&color=white&size=280&Title=&Message=&Target=&From=2026,1,1,0,0,0&Color=white">
            </iframe>
        </div>
        <iframe linkunderline="NO" width="300" scrolling="no"
            src="https://ticker.mivzakim.net/ticker/category/1?bgcolor=1d588f&speed=5000&linkcolor=ffffff&fontsize=24"></iframe>
    </div>

    <!-- Background lobby music: public-domain classical recordings, see music/SOURCES.md -->
    <button id="music-enable" type="button" aria-label="הפעל מוסיקה">&#128266; הפעל מוסיקה</button>
    <audio id="lobby-music" preload="auto"></audio>
    <script>
        (function () {
            var PLAYLIST = [
                'music/01-satie-gymnopedie-1.mp3',
                'music/02-chopin-nocturne-op9-no2.mp3',
                'music/03-schumann-traumerei.mp3',
                'music/04-bach-air-on-g-string.mp3',
                'music/05-beethoven-moonlight-1st.mp3'
            ];
            var VOLUME = 0.35;
            var audio = document.getElementById('lobby-music');
            var enableBtn = document.getElementById('music-enable');
            var index = 0;

            audio.volume = VOLUME;

            function loadTrack(i) {
                index = ((i % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
                audio.src = PLAYLIST[index];
            }

            function showEnableButton(show) {
                enableBtn.style.display = show ? 'block' : 'none';
            }

            function startPlayback() {
                var p = audio.play();
                if (p && typeof p.catch === 'function') {
                    p.then(function () {
                        if (!audio.muted) { showEnableButton(false); }
                    }).catch(function () {
                        /* Autoplay with sound blocked: play muted so the playlist
                           keeps its place, and wait for one user gesture. */
                        audio.muted = true;
                        audio.play().catch(function () {});
                        showEnableButton(true);
                    });
                }
            }

            function enableSound() {
                audio.muted = false;
                audio.volume = VOLUME;
                audio.play().catch(function () {});
                showEnableButton(false);
            }

            enableBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                enableSound();
            });
            /* Any first interaction with the TV (remote click, touch, key) enables sound. */
            ['click', 'touchstart', 'keydown'].forEach(function (evt) {
                document.addEventListener(evt, function once() {
                    if (audio.muted || audio.paused) { enableSound(); }
                    document.removeEventListener(evt, once);
                });
            });

            audio.addEventListener('ended', function () {
                loadTrack(index + 1);
                audio.play().catch(function () {});
            });
            audio.addEventListener('error', function () {
                /* Skip a track that fails to load so the playlist never stalls. */
                loadTrack(index + 1);
                audio.play().catch(function () {});
            });

            loadTrack(0);
            showEnableButton(false);
            startPlayback();
        })();
    </script>
</body>

</html>
